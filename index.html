<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Schedule</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #f0f4f8;
      --surface:      #ffffff;
      --surface2:     #ebf8ff;
      --border:       #bee3f8;
      --border-soft:  #e2e8f0;
      --border-faint: #f7fafc;
      --text:         #1a202c;
      --text-muted:   #718096;
      --text-faint:   #a0aec0;
      --text-faintest:#cbd5e0;
      --heading:      #2b6cb0;
      --heading-dark: #2d3748;
      --shadow:       rgba(0,0,0,0.08);
      --progress-bg:  #e2e8f0;
    }

    body.dark {
      --bg:           #0f1117;
      --surface:      #1a1d27;
      --surface2:     #1e2a3a;
      --border:       #2a4a6b;
      --border-soft:  #2d3748;
      --border-faint: #1e2330;
      --text:         #e2e8f0;
      --text-muted:   #a0aec0;
      --text-faint:   #718096;
      --text-faintest:#4a5568;
      --heading:      #63b3ed;
      --heading-dark: #e2e8f0;
      --shadow:       rgba(0,0,0,0.4);
      --progress-bg:  #2d3748;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      color: var(--text);
      transition: background 0.2s, color 0.2s;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      width: 100%;
      max-width: 1200px;
      position: relative;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--heading);
    }

    /* ── Dark mode toggle ── */
    .dark-toggle {
      position: absolute;
      right: 0;
      background: var(--surface);
      border: 1.5px solid var(--border-soft);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 0.4rem 0.75rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .dark-toggle:hover { background: var(--border-soft); }

    .hidden { display: none !important; }

    /* ── Teacher grid view ── */
    #teacher-view { width: 100%; max-width: 1200px; }

    .teacher-clock {
      text-align: center;
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }
    .teacher-clock span { font-weight: 700; color: var(--heading-dark); }

    #teacher-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      width: 100%;
    }
    @media (max-width: 900px) { #teacher-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 500px) { #teacher-grid { grid-template-columns: 1fr; } }

    .student-tile {
      background: var(--surface);
      border-radius: 12px;
      box-shadow: 0 2px 8px var(--shadow);
      overflow: hidden;
    }

    .student-tile-header {
      padding: 0.75rem 1rem;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }

    .student-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--heading);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .student-name:hover { opacity: 0.8; }

    .student-tile-body { padding: 1rem; }

    .tile-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 0.25rem;
    }
    .tile-label.green  { color: #38a169; }
    .tile-label.orange { color: #dd6b20; }
    .tile-label.blue   { color: #3182ce; }

    .tile-now  { font-size: 1rem; font-weight: 700; margin-bottom: 0.2rem; }
    .tile-time { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.5rem; }

    .tile-progress-wrap {
      background: var(--progress-bg);
      border-radius: 99px;
      height: 5px;
      overflow: hidden;
      margin-bottom: 0.25rem;
    }
    .tile-progress-fill { height: 100%; background: #48bb78; border-radius: 99px; }
    .tile-pct { font-size: 0.75rem; color: var(--text-faint); margin-bottom: 0.6rem; }

    .tile-next { margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--border-soft); }
    .tile-next-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #3182ce; margin-bottom: 0.2rem; }
    .tile-next-title { font-size: 0.88rem; font-weight: 600; }
    .tile-next-time  { font-size: 0.78rem; color: var(--text-faint); }

    .tile-schedule { margin-top: 0.75rem; border-top: 1px solid var(--border-soft); padding-top: 0.75rem; }
    .tile-schedule-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-faint); margin-bottom: 0.5rem; }
    .tile-schedule-item { display: flex; gap: 0.5rem; align-items: center; padding: 0.3rem 0; font-size: 0.8rem; border-bottom: 1px solid var(--border-faint); }
    .tile-schedule-item:last-child { border-bottom: none; }
    .tile-schedule-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .tile-schedule-item.past     { color: var(--text-faint); }
    .tile-schedule-item.past .tile-schedule-dot { background: var(--text-faintest); }
    .tile-schedule-item.current  { font-weight: 700; }
    .tile-schedule-item.current .tile-schedule-dot { background: #48bb78; }
    .tile-schedule-item.upcoming .tile-schedule-dot { background: #4299e1; }
    .tile-schedule-time { min-width: 95px; color: var(--text-muted); font-size: 0.75rem; flex-shrink: 0; }
    .tile-schedule-item.past .tile-schedule-time { color: var(--text-faintest); }

    .tile-error   { font-size: 0.82rem; color: #fc8181; }
    .tile-loading { font-size: 0.82rem; color: var(--text-faint); }

    /* ── Student detail view ── */
    #detail-view { width: 100%; max-width: 560px; }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--surface);
      border: 1.5px solid var(--border-soft);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 1.25rem;
      transition: background 0.15s;
    }
    .back-btn:hover { background: var(--border-soft); }

    .detail-student-name {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--heading);
      margin-bottom: 1rem;
      text-align: center;
    }

    .clock {
      text-align: center;
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }
    .clock span { font-weight: 700; color: var(--heading-dark); }

    .card {
      background: var(--surface);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
      box-shadow: 0 2px 8px var(--shadow);
    }
    .card-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-faint);
      margin-bottom: 0.4rem;
    }
    .card.now  { border-left: 4px solid #48bb78; }
    .card.now  .card-label { color: #38a169; }
    .card.next { border-left: 4px solid #4299e1; }
    .card.next .card-label { color: #3182ce; }
    .card.free { border-left: 4px solid #ed8936; }
    .card.free .card-label { color: #dd6b20; }

    .event-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.2rem; }
    .event-time  { font-size: 0.88rem; color: var(--text-muted); }

    .progress-bar-wrap {
      margin-top: 0.75rem;
      background: var(--progress-bg);
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
    }
    .progress-bar-fill { height: 100%; background: #48bb78; border-radius: 99px; transition: width 1s linear; }
    .progress-label { margin-top: 0.3rem; font-size: 0.78rem; color: var(--text-muted); }

    .today-list { margin-top: 0.25rem; }
    .today-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.55rem 0;
      border-bottom: 1px solid var(--border-faint);
      font-size: 0.88rem;
    }
    .today-item:last-child { border-bottom: none; }
    .today-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--text-faintest); }
    .today-item.past     { color: var(--text-faint); }
    .today-item.past .today-dot { background: var(--text-faint); }
    .today-item.current  { font-weight: 700; }
    .today-item.current .today-dot { background: #48bb78; }
    .today-item.upcoming .today-dot { background: #4299e1; }
    .today-time { color: var(--text-muted); min-width: 110px; font-size: 0.82rem; }
    .today-item.past .today-time { color: var(--text-faintest); }

    .no-events { text-align: center; color: var(--text-faint); padding: 1.5rem; font-size: 0.95rem; }
  </style>
</head>
<body>

<div class="page-header">
  <h1>St. John Henry Newman Schedule</h1>
  <button class="dark-toggle" onclick="toggleDark()" title="Toggle dark mode">🌙</button>
</div>

<!-- ══ TEACHER GRID VIEW ══ -->
<div id="teacher-view">
  <div class="teacher-clock">Right now: <span id="teacher-clock-time"></span></div>
  <div id="teacher-grid"></div>
</div>

<!-- ══ STUDENT DETAIL VIEW ══ -->
<div id="detail-view" class="hidden">
  <button class="back-btn" onclick="showTeacherView()">&#8592; All Students</button>
  <div id="detail-name" class="detail-student-name"></div>
  <div id="detail-status"></div>
</div>

<script>
  const PROXY = 'https://calalendar-proxy.beatrice-gabbard.workers.dev/?url=';

  const DEFAULT_STUDENTS = [
    { name: 'Thomas',   url: 'https://calendar.google.com/calendar/ical/7a72702ed130ea976e362f1fcc473ac6c54ee6838d9e0da61f54f69b91424746%40group.calendar.google.com/public/basic.ics' },
    { name: 'Nicholas', url: 'https://calendar.google.com/calendar/ical/354519411ad4f6faea431916d9c83f2b091187f6f08fe7d728294ff4425937c9%40group.calendar.google.com/public/basic.ics' },
    { name: 'Beatrice', url: 'https://calendar.google.com/calendar/ical/87018e330d56d74aa96c5646039fbf377f54f691bcde545f1f2a11e6b1826751%40group.calendar.google.com/public/basic.ics' },
    { name: 'James',    url: 'https://calendar.google.com/calendar/ical/28d6efd2ab5cab9d72ebaf8d356fe473fed819f098da7ac1c104833bec84ba1b%40group.calendar.google.com/public/basic.ics' },
  ];

  let teacherStudents     = [];
  let teacherRefreshTimer = null;
  let teacherClockTimer   = null;
  let detailClockTimer    = null;
  let detailRefreshTimer  = null;
  let currentDetailIdx    = null;

  // ── Dark mode ──────────────────────────────────────────

  function toggleDark() {
    const dark = document.body.classList.toggle('dark');
    localStorage.setItem('dark', dark ? '1' : '0');
    document.querySelector('.dark-toggle').textContent = dark ? '☀️' : '🌙';
  }

  // ── Utilities ──────────────────────────────────────────

  function fmt(d) {
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function esc(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function parseICalDate(str) {
    const clean = str.includes(':') ? str.split(':').pop() : str;
    if (clean.length === 8) {
      const y = clean.slice(0,4), mo = clean.slice(4,6), d = clean.slice(6,8);
      return new Date(`${y}-${mo}-${d}T00:00:00`);
    }
    const y = clean.slice(0,4), mo = clean.slice(4,6), d = clean.slice(6,8);
    const h = clean.slice(9,11), mi = clean.slice(11,13), s = clean.slice(13,15);
    if (clean.endsWith('Z')) return new Date(`${y}-${mo}-${d}T${h}:${mi}:${s}Z`);
    return new Date(`${y}-${mo}-${d}T${h}:${mi}:${s}`);
  }

  function parseIcal(text, label = '?') {
    const tag = `[parseIcal:${label}]`;
    console.log(`${tag} Parsing iCal text (${text.length} chars)`);
    const raw_events = [];
    const lines = text.replace(/\r\n /g, '').replace(/\r\n\t/g, '').split(/\r?\n/);
    let ev = null;
    for (const raw of lines) {
      const line = raw.trim();
      if (line === 'BEGIN:VEVENT') { ev = {}; continue; }
      if (line === 'END:VEVENT') {
        if (ev && ev.start && ev.end && ev.title) {
          raw_events.push(ev);
          console.log(`${tag} Parsed VEVENT: "${ev.title}" uid=${ev.uid} recurrenceId=${ev.recurrenceId} rrule=${ev.rrule} start=${ev.start} end=${ev.end}`);
        } else if (ev) {
          console.warn(`${tag} Skipping incomplete event (missing start, end, or title):`, JSON.stringify(ev));
        }
        ev = null; continue;
      }
      if (!ev) continue;
      if (line.startsWith('DTSTART')) ev.start = parseICalDate(line.split(':').slice(1).join(':'));
      else if (line.startsWith('DTEND'))          ev.end          = parseICalDate(line.split(':').slice(1).join(':'));
      else if (line.startsWith('SUMMARY:'))       ev.title        = line.slice(8).replace(/\\,/g,',').replace(/\\n/g,'\n');
      else if (line.startsWith('DESCRIPTION:'))   ev.description  = line.slice(12).replace(/\\,/g,',').replace(/\\n/g,'\n');
      else if (line.startsWith('LOCATION:'))      ev.location     = line.slice(9);
      else if (line.startsWith('RRULE:'))         ev.rrule        = line.slice(6);
      else if (line.startsWith('UID:'))           ev.uid          = line.slice(4).trim();
      else if (line.startsWith('RECURRENCE-ID'))  { ev.recurrenceId = parseICalDate(line.split(':').slice(1).join(':')); console.log(`${tag} Found RECURRENCE-ID line: "${line}" → ${ev.recurrenceId}`); }
      else if (line.startsWith('EXDATE'))         ev.exdates      = [...(ev.exdates||[]), ...line.split(':').slice(1).join(':').split(',').map(parseICalDate)];
    }

    const now = new Date();
    const windowStart = new Date(now); windowStart.setHours(0,0,0,0);
    const windowEnd   = new Date(now); windowEnd.setHours(23,59,59,999);
    console.log(`${tag} Window: ${windowStart} → ${windowEnd}`);
    console.log(`${tag} Total raw_events parsed: ${raw_events.length}`);

    // Separate override instances (have RECURRENCE-ID) from base events
    const overrides = raw_events.filter(e => e.recurrenceId);
    const baseEvents = raw_events.filter(e => !e.recurrenceId);
    console.log(`${tag} Base events: ${baseEvents.length}, Overrides (RECURRENCE-ID): ${overrides.length}`);
    overrides.forEach(o => console.log(`${tag} Override: "${o.title}" uid=${o.uid} recurrenceId=${o.recurrenceId} start=${o.start}`));

    // Key: uid + date string of the overridden occurrence
    const overriddenKeys = new Set(overrides.map(o => {
      const d = o.recurrenceId;
      return `${o.uid}|${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    }));
    console.log(`${tag} Overridden keys:`, [...overriddenKeys]);

    const events = [];
    for (const base of baseEvents) {
      if (!base.rrule) {
        // Non-recurring: include if today and not overridden
        const key = `${base.uid}|${base.start.getFullYear()}-${base.start.getMonth()}-${base.start.getDate()}`;
        const inWindow = base.start >= windowStart && base.start <= windowEnd;
        const blocked = overriddenKeys.has(key);
        console.log(`${tag} Non-recurring "${base.title}": inWindow=${inWindow} overridden=${blocked} key=${key}`);
        if (inWindow && !blocked) events.push(base);
        continue;
      }

      const duration = base.end - base.start;
      const parts = Object.fromEntries(base.rrule.split(';').map(p => p.split('=')));
      const freq     = parts.FREQ;
      const interval = parseInt(parts.INTERVAL || '1', 10);
      const until    = parts.UNTIL ? parseICalDate(parts.UNTIL) : null;
      const count    = parts.COUNT ? parseInt(parts.COUNT, 10) : null;
      const byDay    = parts.BYDAY ? parts.BYDAY.split(',') : null;

      // day-of-week map for BYDAY
      const DOW = {SU:0,MO:1,TU:2,WE:3,TH:4,FR:5,SA:6};

      const isExcluded = (d) => (base.exdates||[]).some(ex =>
        ex.getFullYear()===d.getFullYear() && ex.getMonth()===d.getMonth() && ex.getDate()===d.getDate()
      );

      let cursor = new Date(base.start);
      let generated = 0;
      const maxIter = 2000;
      for (let iter = 0; iter < maxIter; iter++) {
        const breakAnchor = (byDay && freq === 'WEEKLY')
          ? new Date(cursor.getTime() - cursor.getDay() * 86400000)  // Sunday of cursor's week
          : cursor;
        if (until && cursor > until) break;
        if (count !== null && generated >= count) break;
        if (breakAnchor > windowEnd) break;

        const candidates = [];
        if (byDay && (freq === 'WEEKLY' || freq === 'DAILY')) {
          // emit one occurrence per matching weekday within this week anchor
          const weekStart = new Date(cursor);
          weekStart.setDate(cursor.getDate() - cursor.getDay()); // Sunday of cursor's week
          for (const d of byDay) {
            const dow = DOW[d.replace(/[+-]?\d*/g,'')];
            if (dow === undefined) continue;
            const date = new Date(weekStart);
            date.setDate(weekStart.getDate() + dow);
            date.setHours(cursor.getHours(), cursor.getMinutes(), cursor.getSeconds());
            candidates.push(date);
          }
        } else {
          candidates.push(new Date(cursor));
        }

        for (const c of candidates) {
          if (until && c > until) continue;
          if (count !== null && generated >= count) continue;
          if (c < base.start) continue;
          const occKey = `${base.uid}|${c.getFullYear()}-${c.getMonth()}-${c.getDate()}`;
          const inWindow = c >= windowStart && c <= windowEnd;
          const excluded = isExcluded(c);
          const overridden = overriddenKeys.has(occKey);
          if (inWindow) console.log(`${tag} Recurring occ "${base.title}" @ ${c}: excluded=${excluded} overridden=${overridden} key=${occKey}`);
          if (!excluded && inWindow && !overridden) {
            events.push({...base, start: c, end: new Date(c.getTime() + duration)});
          }
          if (c >= base.start) generated++;
        }

        if (freq === 'DAILY')        cursor.setDate(cursor.getDate() + interval);
        else if (freq === 'WEEKLY')  cursor.setDate(cursor.getDate() + 7 * interval);
        else if (freq === 'MONTHLY') cursor.setMonth(cursor.getMonth() + interval);
        else if (freq === 'YEARLY')  cursor.setFullYear(cursor.getFullYear() + interval);
        else break;
      }
    }

    // Add override instances that fall today
    for (const o of overrides) {
      const inWindow = o.start >= windowStart && o.start <= windowEnd;
      console.log(`${tag} Override instance "${o.title}" start=${o.start}: inWindow=${inWindow}`);
      if (inWindow) events.push(o);
    }

    console.log(`${tag} Found ${events.length} valid events:`, events);
    return events;
  }

  function todayEvents(events) {
    const now = new Date();
    const s = new Date(now); s.setHours(0,0,0,0);
    const e = new Date(now); e.setHours(23,59,59,999);
    const todays = events.filter(ev => ev.start >= s && ev.start <= e).sort((a,b) => a.start - b.start);
    console.log(`[todayEvents] ${todays.length} of ${events.length} events fall on today (${now.toDateString()}):`,
      todays.map(ev => `"${ev.title}" ${fmt(ev.start)}–${fmt(ev.end)}`));
    return todays;
  }

  const fetchFresh = (url) => {
    const normalized = encodeURIComponent(decodeURIComponent(url));
    const proxyUrl = PROXY + normalized;
    console.debug('[fetchFresh] Requesting:', proxyUrl);
    return fetch(proxyUrl, { cache: 'no-store' });
  };

  async function fetchWithRetry(url, retries = 6) {
    for (let i = 0; i < retries; i++) {
      const attempt = i + 1;
      console.log(`[fetchWithRetry] Attempt ${attempt}/${retries} for: ${url}`);
      try {
        const res = await fetchFresh(url);
        if (res.ok) {
          console.log(`[fetchWithRetry] Success on attempt ${attempt} (HTTP ${res.status})`);
          return res;
        }
        console.warn(`[fetchWithRetry] Attempt ${attempt} got HTTP ${res.status}`);
      } catch (err) {
        console.warn(`[fetchWithRetry] Attempt ${attempt} threw:`, err);
      }
      if (i < retries - 1) {
        const delay = 1000 * Math.pow(2, i);
        console.log(`[fetchWithRetry] Waiting ${delay / 1000}s before next attempt…`);
        await new Promise(r => setTimeout(r, delay));
      }
    }
    console.error(`[fetchWithRetry] All ${retries} attempts failed for: ${url}`);
    throw new Error('Failed to fetch after retries');
  }

  // ── Teacher grid ───────────────────────────────────────

  function renderTeacherGrid() {
    const grid = document.getElementById('teacher-grid');
    const now  = new Date();

    grid.innerHTML = teacherStudents.map((s, i) => {
      const todays   = s.events ? todayEvents(s.events) : null;
      const current  = todays && todays.find(e => e.start <= now && e.end > now);
      const upcoming = todays && todays.find(e => e.start > now);

      let body = '';
      if (s.error) {
        body = `<div class="tile-error">Could not load: ${esc(s.error)}</div>`;
      } else if (!todays) {
        body = `<div class="tile-loading">Loading…</div>`;
      } else if (current) {
        const pct = Math.min(100, Math.round((now - current.start) / (current.end - current.start) * 100));
        const remaining = Math.ceil((current.end - now) / 60000);
        body = `
          <div class="tile-label green">Happening Now</div>
          <div class="tile-now">${esc(current.title)}</div>
          <div class="tile-time">${fmt(current.start)} &ndash; ${fmt(current.end)}${current.location ? ' &bull; ' + esc(current.location) : ''}</div>
          <div class="tile-progress-wrap"><div class="tile-progress-fill" style="width:${pct}%"></div></div>
          <div class="tile-pct">${pct}% done &bull; ${remaining} min left</div>`;
      } else {
        body = `<div class="tile-label orange">Right Now</div><div class="tile-now">Free time</div>`;
      }

      if (upcoming && !s.error) {
        const minsUntil = Math.ceil((upcoming.start - now) / 60000);
        body += `<div class="tile-next">
          <div class="tile-next-label">Up Next &bull; in ${minsUntil} min</div>
          <div class="tile-next-title">${esc(upcoming.title)}</div>
          <div class="tile-next-time">${fmt(upcoming.start)} &ndash; ${fmt(upcoming.end)}</div>
        </div>`;
      }

      if (todays && todays.length === 0 && !s.error) {
        body = `<div class="tile-loading">No events today.</div>`;
      } else if (todays && !s.error) {
        body += `<div class="tile-schedule"><div class="tile-schedule-label">Today&rsquo;s Schedule</div>`;
        for (const e of todays) {
          const cls = e.end <= now ? 'past' : e.start <= now ? 'current' : 'upcoming';
          body += `<div class="tile-schedule-item ${cls}">
            <div class="tile-schedule-dot"></div>
            <div class="tile-schedule-time">${fmt(e.start)} &ndash; ${fmt(e.end)}</div>
            <div>${esc(e.title)}</div>
          </div>`;
        }
        body += `</div>`;
      }

      return `<div class="student-tile">
        <div class="student-tile-header">
          <span class="student-name" onclick="showDetailView(${i})">${esc(s.name)}</span>
        </div>
        <div class="student-tile-body">${body}</div>
      </div>`;
    }).join('');
  }

  function startTeacherClock() {
    const update = () => {
      const el = document.getElementById('teacher-clock-time');
      if (el) el.textContent = fmt(new Date());
    };
    update();
    clearInterval(teacherClockTimer);
    teacherClockTimer = setInterval(update, 1000);
  }

  async function fetchAllStudents() {
    console.log('[fetchAllStudents] Starting fetch for', teacherStudents.map(s => s.name));
    const urlCache = {};
    await Promise.all(teacherStudents.map(async (s, i) => {
      console.log(`[fetchAllStudents] Fetching calendar for ${s.name}`);
      try {
        if (!urlCache[s.url]) {
          console.log(`[fetchAllStudents] URL not cached, fetching: ${s.url}`);
          urlCache[s.url] = fetchWithRetry(s.url).then(r => r.text());
        } else {
          console.log(`[fetchAllStudents] Reusing cached fetch for ${s.name}`);
        }
        const text = await urlCache[s.url];
        console.log(`[fetchAllStudents] Got ${text.length} chars for ${s.name}`);
        if (!text.includes('BEGIN:VCALENDAR')) throw new Error('Not a valid iCal URL — response did not contain BEGIN:VCALENDAR');
        teacherStudents[i].events = parseIcal(text, s.name);
        teacherStudents[i].error  = null;
        console.log(`[fetchAllStudents] ✓ ${s.name} loaded with ${teacherStudents[i].events.length} total events`);
      } catch (err) {
        console.error(`[fetchAllStudents] ✗ Failed to load ${s.name}:`, err);
        teacherStudents[i].error = err.message;
      }
      renderTeacherGrid();
    }));
    console.log('[fetchAllStudents] Done');
  }

  // ── Student detail view ────────────────────────────────

  function renderDetail(idx) {
    const s = teacherStudents[idx];
    const now = new Date();
    const todays   = s.events ? todayEvents(s.events) : [];
    const current  = todays.find(e => e.start <= now && e.end > now);
    const upcoming = todays.find(e => e.start > now);

    let html = `<div class="clock">Right now: <span id="detail-clock">${fmt(now)}</span></div>`;

    if (current) {
      const pct = Math.min(100, Math.round((now - current.start) / (current.end - current.start) * 100));
      const remaining = Math.ceil((current.end - now) / 60000);
      html += `<div class="card now">
        <div class="card-label">Happening Now</div>
        <div class="event-title">${esc(current.title)}</div>
        <div class="event-time">${fmt(current.start)} &ndash; ${fmt(current.end)}${current.location ? ' &bull; ' + esc(current.location) : ''}</div>
        <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        <div class="progress-label">${pct}% done &bull; ${remaining} min left</div>
      </div>`;
    } else {
      html += `<div class="card free"><div class="card-label">Right Now</div><div class="event-title">Free time</div></div>`;
    }

    if (upcoming) {
      const minsUntil = Math.ceil((upcoming.start - now) / 60000);
      html += `<div class="card next">
        <div class="card-label">Up Next &bull; in ${minsUntil} min</div>
        <div class="event-title">${esc(upcoming.title)}</div>
        <div class="event-time">${fmt(upcoming.start)} &ndash; ${fmt(upcoming.end)}${upcoming.location ? ' &bull; ' + esc(upcoming.location) : ''}</div>
      </div>`;
    }

    if (todays.length === 0) {
      html += `<div class="no-events">No events found for today.</div>`;
    } else {
      html += `<div class="card"><div class="card-label">Today&rsquo;s Full Schedule</div><div class="today-list">`;
      for (const e of todays) {
        const cls = e.end <= now ? 'past' : e.start <= now ? 'current' : 'upcoming';
        html += `<div class="today-item ${cls}">
          <div class="today-dot"></div>
          <div class="today-time">${fmt(e.start)} &ndash; ${fmt(e.end)}</div>
          <div>${esc(e.title)}</div>
        </div>`;
      }
      html += `</div></div>`;
    }

    document.getElementById('detail-status').innerHTML = html;

    clearInterval(detailClockTimer);
    detailClockTimer = setInterval(() => {
      const el = document.getElementById('detail-clock');
      if (el) el.textContent = fmt(new Date());
    }, 1000);
  }

  function showDetailView(idx) {
    currentDetailIdx = idx;
    document.getElementById('teacher-view').classList.add('hidden');
    document.getElementById('detail-view').classList.remove('hidden');
    document.getElementById('detail-name').textContent = teacherStudents[idx].name;
    renderDetail(idx);
    clearInterval(detailRefreshTimer);
    detailRefreshTimer = setInterval(() => renderDetail(currentDetailIdx), 60000);
  }

  function showTeacherView() {
    currentDetailIdx = null;
    clearInterval(detailClockTimer);
    clearInterval(detailRefreshTimer);
    document.getElementById('detail-view').classList.add('hidden');
    document.getElementById('teacher-view').classList.remove('hidden');
  }

  // ── Init ───────────────────────────────────────────────

  window.addEventListener('DOMContentLoaded', () => {
    console.log('[init] Page loaded, starting St. John Henry Newman Schedule');

    // Restore dark mode preference
    if (localStorage.getItem('dark') === '1') {
      document.body.classList.add('dark');
      document.querySelector('.dark-toggle').textContent = '☀️';
    }

    teacherStudents = DEFAULT_STUDENTS.map(e => ({ ...e, events: null, error: null }));
    console.log('[init] Students configured:', teacherStudents.map(s => s.name));
    renderTeacherGrid();
    fetchAllStudents();
    startTeacherClock();

    clearInterval(teacherRefreshTimer);
    teacherRefreshTimer = setInterval(async () => {
      await fetchAllStudents();
      if (currentDetailIdx !== null) renderDetail(currentDetailIdx);
    }, 5 * 60 * 1000);
  });
</script>
</body>
</html>
